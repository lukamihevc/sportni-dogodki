
name: Docker CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            lukamihevc/sportni-dogodki:latest
            lukamihevc/sportni-dogodki:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Instances
        shell: bash
        run: |
          DNS_LABEL=$(az container show \
            --resource-group rg-sportni-dogodki \
            --name sportni-dogodki \
            --query ipAddress.dnsNameLabel \
            --output tsv)

          if [ -z "$DNS_LABEL" ] || [ "$DNS_LABEL" = "None" ]; then
            echo "ERROR: Existing Azure DNS label not found."
            exit 1
          fi

          az container create \
            --resource-group rg-sportni-dogodki \
            --name sportni-dogodki \
            --location switzerlandnorth \
            --os-type Linux \
            --image "lukamihevc/sportni-dogodki:${{ github.sha }}" \
            --cpu 1 \
            --memory 1.5 \
            --ports 8080 \
            --protocol TCP \
            --ip-address Public \
            --dns-name-label "$DNS_LABEL" \
            --restart-policy Always
