
name: Build and deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            lukamihevc/sportni-dogodki:latest
            lukamihevc/sportni-dogodki:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Instances
        shell: bash
        run: |
          set -euo pipefail

          RESOURCE_GROUP="rg-sportni-dogodki"
          CONTAINER_NAME="sportni-dogodki"
          IMAGE="lukamihevc/sportni-dogodki:${{ github.sha }}"

          DNS_LABEL=$(az container show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_NAME" \
            --query ipAddress.dnsNameLabel \
            --output tsv)

          if [ -z "$DNS_LABEL" ] || [ "$DNS_LABEL" = "None" ]; then
            echo "ERROR: Azure DNS label was not found."
            exit 1
          fi

          az container create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_NAME" \
            --location switzerlandnorth \
            --os-type Linux \
            --image "$IMAGE" \
            --cpu 1 \
            --memory 1.5 \
            --ports 8080 \
            --protocol TCP \
            --ip-address Public \
            --dns-name-label "$DNS_LABEL" \
            --restart-policy Always

          az container show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_NAME" \
            --query "{State:instanceView.state,Image:containers[0].image,FQDN:ipAddress.fqdn}" \
            --output table
