
name: Build and deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            lukamihevc/sportni-dogodki:latest
            lukamihevc/sportni-dogodki:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure
        shell: bash
        run: |
          set -euo pipefail
          RG="rg-sportni-dogodki"
          NAME="sportni-dogodki"
          DNS=$(az container show -g "$RG" -n "$NAME" --query ipAddress.dnsNameLabel -o tsv)

          az container create \
            --resource-group "$RG" \
            --name "$NAME" \
            --location switzerlandnorth \
            --os-type Linux \
            --image "lukamihevc/sportni-dogodki:${{ github.sha }}" \
            --cpu 1 \
            --memory 1.5 \
            --ports 8080 \
            --protocol TCP \
            --ip-address Public \
            --dns-name-label "$DNS" \
            --restart-policy Always

          az container show -g "$RG" -n "$NAME" \
            --query "{State:instanceView.state,Image:containers[0].image,FQDN:ipAddress.fqdn}" \
            -o table
